<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | أبو نجيب</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-body"><header class="topbar"><a class="brand" href="/">أبو <span>نجيب</span></a><nav><a href="/">عرض الموقع</a></nav></header><main class="admin-main"><section id="loginPanel" class="login-panel"><p class="eyebrow">إدارة الموقع</p><h1>دخول لوحة الإدارة</h1><p>أدخل كلمة مرور الإدارة لعرض طلبات العملاء.</p><form id="loginForm"><label>كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary" type="submit">تسجيل الدخول</button><p id="loginMessage" class="form-message"></p></form><p class="hint">كلمة المرور الافتراضية موضحة في ملف README. غيّرها قبل نشر الموقع.</p></section><section id="dashboard" hidden><div class="dashboard-head"><div><p class="eyebrow">ملخص الطلبات</p><h1>طلبات العملاء</h1></div><button id="logoutButton" class="btn secondary">تسجيل الخروج</button></div><div class="stat"><span>إجمالي الطلبات</span><strong id="leadCount">0</strong></div><div id="leadsList" class="leads-list"></div><p id="dashboardMessage" class="form-message"></p></section></main><script src="/admin.js"></script></body></html>
